O problema com Certbot dentro do Docker
O Certbot precisa de duas coisas que conflitam com o modelo de container:
1. Acesso ao filesystem do host pra persistir o certificado. Certificado Let's Encrypt fica em /etc/letsencrypt/ e precisa sobreviver ao container ser recriado. Se o Certbot roda dentro do container do Nginx, quando você fizer docker compose down e up de novo, o certificado some — e você esgota o rate limit do Let's Encrypt (50 emissões por domínio por semana).
2. O HTTP-01 challenge precisa que o Nginx sirva um arquivo estático temporário. O Certbot para o Nginx brevemente, coloca o arquivo em /.well-known/acme-challenge/, o Let's Encrypt busca via HTTP, e o Certbot reinicia o Nginx. Dentro de Docker isso complica — o container gerencia o processo do Nginx, e o Certbot tentando parar/reiniciar o Nginx dentro do container pode quebrar o ciclo de vida.
A abordagem correta: Certbot no host, Nginx via volume
A solução padrão pra tua situação é rodar o Certbot no host (no EC2, fora do Docker), deixar o certificado em /etc/letsencrypt/ no host, e montar esse diretório como volume no container do Nginx. O Nginx dentro do container lê o certificado do host via volume — o certificado persiste independente do ciclo de vida do container.
