O certbot --nginx faz três coisas automaticamente que valem entender por baixo:
Prova de domínio (HTTP-01 challenge): o Certbot cria um arquivo temporário em /.well-known/acme-challenge/ no teu servidor. O Let's Encrypt então faz uma requisição HTTP pra http://ecommerce-marcus.duckdns.org/.well-known/acme-challenge/arquivo e verifica que você controla esse domínio — porque só quem controla o servidor pode ter colocado aquele arquivo lá. É como um handshake de propriedade. Por isso a porta 80 precisa estar aberta durante a emissão, mesmo que depois você redirecione tudo pra 443.
Reescrita da config do Nginx: depois do certificado emitido, o Certbot edita automaticamente teu arquivo de config, adicionando:
nginxlisten 443 ssl;
ssl_certificate /etc/letsencrypt/live/ecommerce-marcus.duckdns.org/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/ecommerce-marcus.duckdns.org/privkey.pem;
E cria um segundo bloco server na porta 80 que redireciona tudo pra 443 — o redirect HTTP→HTTPS automático.
Timer de renovação: instala um systemd timer (ou cron, dependendo do sistema) que roda certbot renew periodicamente. O certificado Let's Encrypt expira em 90 dias; a renovação acontece automática quando faltam 30 dias. O --dry-run simula isso sem renovar de verdade, pra confirmar que o mecanismo está funcional.
