O que acontece na pilha quando TLS entra
Hoje o fluxo de uma requisição é:
Internet → EC2:80 → Docker (porta 80 mapeada) → Nginx container → upstream
O Nginx recebe HTTP puro, faz proxy pro frontend ou backend. Tudo em texto claro.
Com TLS, o fluxo vira:
Internet → EC2:443 → Docker (porta 443 mapeada) → Nginx container
                                                    ↓
                                              TLS termination aqui
                                              (Nginx descriptografa)
                                                    ↓
                                              proxy HTTP interno
                                              → upstream (frontend/backend)
O Nginx passa a ser o TLS terminator — ele negocia o handshake TLS com o cliente, descriptografa os dados, e passa HTTP limpo pro upstream. O Spring Boot e o Next.js não sabem que existe TLS; eles continuam recebendo HTTP normal. Isso é correto e é o padrão de produção.
O certificado TLS tem duas partes que vivem em /etc/letsencrypt/live/ecommerce-marcus.duckdns.org/ no host:

fullchain.pem — o certificado público (Nginx apresenta isso pro browser pra provar identidade)
privkey.pem — a chave privada (usada na criptografia assimétrica do handshake TLS)

O Nginx precisa ler os dois. Como ele roda dentro de um container, você monta o diretório do host como volume — o container lê os arquivos do host sem que o certificado precise existir dentro da imagem.
Sequência completa
Passo 1 — Porta 443 no Security Group (se ainda não fez)
Console AWS → EC2 → Security Groups → Inbound rules → Add rule:

Type: HTTPS
Port: 443
Source: 0.0.0.0/0

Sem isso, o TLS nunca chega ao Nginx — o pacote morre no firewall da AWS antes de entrar na instância.
Passo 2 — Instala Certbot no host (não dentro do Docker)
bashsudo apt update
sudo apt install certbot -y
Repara: instala só o certbot, sem o python3-certbot-nginx. O plugin do Nginx não funciona aqui porque o Nginx está dentro do Docker, não no host. Você vai usar o modo --standalone ou --webroot — e eu vou usar --standalone, que é mais simples.
Passo 3 — Para o container do Nginx brevemente
O Certbot no modo --standalone sobe um servidor HTTP temporário na porta 80 pra responder o HTTP-01 challenge. Mas a porta 80 do EC2 já está ocupada pelo container do Nginx. Então você para o Nginx por ~30 segundos:
bashdocker compose stop nginx
Passo 4 — Emite o certificado
bashsudo certbot certonly --standalone -d ecommerce-marcus.duckdns.org
O certonly diz "emite o certificado, mas não mexa em nenhuma config de servidor" — você vai configurar o Nginx manualmente. O --standalone diz "sobe teu próprio servidor HTTP temporário na porta 80 pra fazer o challenge". O Let's Encrypt faz uma requisição pra http://ecommerce-marcus.duckdns.org/.well-known/acme-challenge/TOKEN e verifica que você controla o domínio.
Isso cria os arquivos em /etc/letsencrypt/live/ecommerce-marcus.duckdns.org/ no host.
Passo 5 — Sobe o Nginx de volta
bashdocker compose start nginx
Passo 6 — Atualiza o docker-compose.yml
Adiciona a porta 443 e dois volumes — o diretório de certificados e o diretório de configuração do Let's Encrypt (que o Certbot usa internamente pra renovação):
yamlnginx:
  image: nginx:alpine
  container_name: commerce-nginx
  restart: always
  ports:
    - "80:80"
    - "443:443"
  volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    - /etc/letsencrypt:/etc/letsencrypt:ro
  depends_on:
    - frontend
    - backend
  networks:
    - app-network
O volume /etc/letsencrypt:/etc/letsencrypt:ro monta o diretório inteiro do Let's Encrypt como read-only dentro do container. O Nginx vai ler fullchain.pem e privkey.pem de lá — sem copiar pra dentro da imagem, sem reconstruir nada.
Passo 7 — Atualiza o nginx.conf
Substitui o conteúdo pelo seguinte — eu mantive tua estrutura de upstream intacta, só adicionei o bloco 443 e o redirect 80→443:
nginxevents {
    worker_connections 1024;
}

http {
    upstream frontend {
        server commerce-web:3000;
    }

    upstream backend {
        server commerce-api:8080;
    }

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name ecommerce-marcus.duckdns.org;
        return 301 https://$host$request_uri;
    }

    # HTTPS — TLS termination aqui
    server {
        listen 443 ssl;
        server_name ecommerce-marcus.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/ecommerce-marcus.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ecommerce-marcus.duckdns.org/privkey.pem;

        # Protocolos e ciphers modernos (TLS 1.2 e 1.3 apenas)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}