Mas entende o que acontece por baixo, porque o mecanismo é importante:
O que muda e o que não muda na instância
O IP que você vê como "público" no console AWS nunca foi da tua instância de verdade. Ele era da AWS, emprestado pra ti. O que a instância tem de verdade é um IP privado (algo como 172.31.x.x) dentro da VPC (rede privada da AWS). O IP público é uma tradução — a AWS mantém uma tabela de NAT (Network Address Translation) que diz "qualquer pacote chegando em 15.228.220.251 vai pra 172.31.x.x". O IP público é só um alias externo.
Quando você associa um Elastic IP, a AWS faz exatamente a mesma coisa — só que agora a entrada da tabela NAT aponta pro Elastic IP em vez do dinâmico. O IP privado da instância (172.31.x.x) não muda absolutamente nada. O Nginx, o Docker, o Spring Boot, todos escutam no IP privado internamente — eles nem sabem qual é o IP público. Pra eles é transparente.
Então o que muda: o alias externo (o IP que o mundo vê).
O que não muda: IP privado, Nginx, Docker, Spring, banco, tudo interno.
A única consequência prática
O link http://15.228.220.251/ que está no currículo agora para de funcionar no momento que você associar o Elastic IP. Mas aí você já vai ter o domínio DuckDNS + HTTPS configurados, e o link do currículo vai ser https://marcus-commerce.duckdns.org — que é permanente e não quebra mais nunca, independente de qualquer troca de IP. É uma troca única, deliberada, pela estabilidade definitiva.
A sequência correta pra não ter momento de link quebrado:
1. Aloca o Elastic IP (ainda não associa)
2. Configura DuckDNS apontando pro Elastic IP novo
3. Associa o Elastic IP à instância ← aqui o 15.228.220.251 para
4. Roda Certbot com o domínio DuckDNS
5. Atualiza o currículo com https://marcus-commerce.duckdns.org
Fazendo nessa ordem, o downtime é mínimo — só o tempo entre o passo 3 e o 4, que são minutos. E depois disso o link é permanente.
