Quando confirmar os dois pontos acima, a sequência é:
bash# 1. Instala o Certbot com o plugin do Nginx
sudo apt update
sudo apt install certbot python3-certbot-nginx -y

# 2. Emite o certificado e deixa o Certbot reescrever o Nginx
