Perfeito — se você já tem Nginx no projeto, você está a poucos passos de HTTPS, e vou te explicar não só o passo a passo, mas o que cada peça faz por baixo, porque é exatamente o tipo de coisa que separa "segui um tutorial" de "entendo o que configurei" — e isso importa numa entrevista.
Primeiro, o que vai acontecer por baixo dos panos
Hoje seu fluxo é: navegador → http://15.228.220.251 → Nginx (porta 80) → proxy_pass pra tua aplicação Spring (porta 8080, provavelmente). Tudo em texto aberto.
O que queremos: navegador → https://seu-dominio → Nginx (porta 443, com TLS) → tua aplicação. O Nginx passa a ser o terminador TLS — ele descriptografa o tráfego HTTPS na borda e conversa com o Spring em HTTP local (o que é seguro, porque é dentro da própria máquina). Tua aplicação Java nem precisa saber que existe TLS; o Nginx cuida disso. Isso se chama TLS termination, e é a arquitetura padrão de produção.
O certificado TLS é o que prova ao navegador que o servidor é quem diz ser, e fornece as chaves pra criptografia. O Let's Encrypt é uma autoridade certificadora gratuita e automatizada. A ferramenta Certbot conversa com o Let's Encrypt, prova que você controla o domínio, baixa o certificado e configura o Nginx automaticamente.
O problema do IP: você precisa de um domínio primeiro
Aqui tem um bloqueio técnico que você precisa entender: o Let's Encrypt não emite certificado pra IP puro. Ele valida por domínio — o mecanismo de validação (o "ACME challenge") pergunta "você controla o nome x.com?" e verifica via DNS ou HTTP. IP não tem dono verificável desse jeito. Então HTTPS exige um domínio apontando pro teu IP.
Duas opções:
Opção rápida e grátis — DuckDNS ou nip.io:

nip.io é mágico e instantâneo: 15.228.220.251.nip.io já resolve pro teu IP automaticamente, sem cadastro. Mas alguns validam certificado com ressalvas.
DuckDNS é melhor: cria grátis algo como marcus-commerce.duckdns.org apontando pro teu IP. Leva 2 minutos, e o Let's Encrypt emite certificado normal pra ele.

Opção profissional — domínio próprio: registrar um .dev ou .com.br (uns R$40/ano). Melhor pro currículo, mas custa e leva algumas horas pra propagar.
Pra teu momento, DuckDNS é o custo-benefício perfeito: grátis, rápido, e o link fica estável (sobrevive à troca de IP do EC2, resolvendo aquele problema que eu levantei).
Passo a passo
1. Cria o subdomínio no DuckDNS
Entra em duckdns.org, loga com Google/GitHub, cria um subdomínio (ex: marcus-commerce) e aponta pro IP 15.228.220.251. Agora marcus-commerce.duckdns.org resolve pra tua máquina.
2. Libera a porta 443 no Security Group do EC2
Isso é crítico e muita gente esquece. O Security Group da AWS é um firewall na frente da instância. Hoje você tem a porta 80 liberada; precisa liberar a 443 (HTTPS) também. No console AWS → EC2 → Security Groups → Inbound rules → Add rule → HTTPS (443) → Source 0.0.0.0/0. Sem isso, o mundo não alcança a porta segura.
3. Confirma que teu server_name no Nginx aceita o domínio
No teu arquivo de config (provavelmente /etc/nginx/sites-available/default ou similar), o bloco server precisa reconhecer o domínio:
nginxserver {
    listen 80;
    server_name marcus-commerce.duckdns.org;

    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
Aquele X-Forwarded-Proto $scheme importa: ele informa ao Spring se a requisição original veio por http ou https. Sem esse header, tua aplicação pode gerar URLs erradas (http em vez de https) atrás do proxy. Recarrega: sudo nginx -t (testa a config) e sudo systemctl reload nginx.
4. Instala o Certbot e emite o certificado
bashsudo apt update
sudo apt install certbot python3-certbot-nginx -y
sudo certbot --nginx -d marcus-commerce.duckdns.org
O que o certbot --nginx faz automaticamente, e vale entender:

Prova ao Let's Encrypt que você controla o domínio (coloca um arquivo temporário que o Let's Encrypt busca via HTTP — o "HTTP-01 challenge").
Baixa o certificado e a chave privada.
Reescreve tua config do Nginx sozinho: adiciona o bloco listen 443 ssl, aponta pros arquivos do certificado, e cria um redirect automático de 80 → 443 (todo http vira https). Ele pergunta se você quer esse redirect — responde sim.

5. Testa
Abre https://marcus-commerce.duckdns.org. Cadeado verde, "seguro". Teu JWT agora trafega criptografado — a contradição de "segurança sem TLS" some.
Um detalhe que fecha o ciclo (renovação)
Certificado Let's Encrypt expira em 90 dias — de propósito, pra forçar automação. O Certbot já instala um timer do systemd que renova sozinho antes de expirar. Confere com sudo certbot renew --dry-run — se passar, você nunca mais pensa nisso. Isso é bom saber pra entrevista: se perguntarem "e quando o certificado expira?", você responde que a renovação é automática via cron/systemd timer, o que mostra que você entende operação, não só setup.

