events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Don't advertise the nginx version in responses and error pages.
    server_tokens off;

    # Allow large image uploads (high-quality phone photos). Must be >= the API's
    # spring.servlet.multipart.max-request-size; nginx's default of 1MB otherwise
    # rejects them with 413 before they ever reach the backend.
    client_max_body_size 200M;

    # Drop a client that opens a connection and then stalls, instead of holding a
    # worker slot for it.
    client_body_timeout 30s;
    client_header_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # Per-IP request budgets, keyed on the client address.
    #
    # auth: login and register. 30r/m still lets a human fumble their password
    # several times in a row, but caps an unattended password-guessing loop at
    # 1800 attempts/hour instead of as fast as the network allows.
    # api: everything else. A page load makes a handful of calls, so 10r/s with a
    # burst of 20 is invisible to real traffic.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    upstream frontend {
        server commerce-web:3000;
    }

    upstream backend {
        server commerce-api:8080;
    }

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name ecommerce-marcus.duckdns.org;

        # Certbot's webroot challenge must stay on plain HTTP.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS — TLS termination aqui
    server {
        listen 443 ssl;
        http2 on;
        server_name ecommerce-marcus.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/ecommerce-marcus.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ecommerce-marcus.duckdns.org/privkey.pem;

        # Protocolos e ciphers modernos (TLS 1.2 e 1.3 apenas)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Declared once at server level on purpose: an add_header inside a location
        # replaces the whole inherited set rather than adding to it, so these must
        # not be repeated per-location.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # No Content-Security-Policy yet: Next.js hydration relies on inline scripts,
        # so a policy has to be built against the real page and verified before it
        # goes on — a wrong one silently breaks the app.

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Must precede the generic /api/ block — nginx picks the longest matching
        # prefix, so this wins for login/register and applies the tighter budget.
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;

            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;

            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Image uploads run long; the default 60s read timeout cuts them off.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # The actuator health endpoint is for the container healthcheck and the host,
        # not the public internet.
        location /api/actuator/ {
            deny all;
        }
    }
}
