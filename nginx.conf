events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server commerce-web:3000;
    }

    upstream backend {
        server commerce-api:8080;
    }

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name ecommerce-marcus.duckdns.org;
        return 301 https://$host$request_uri;
    }

    # HTTPS — TLS termination aqui
    server {
        listen 443 ssl;
        server_name ecommerce-marcus.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/ecommerce-marcus.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ecommerce-marcus.duckdns.org/privkey.pem;

        # Protocolos e ciphers modernos (TLS 1.2 e 1.3 apenas)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}