spring.application.name=API
spring.profiles.active=local

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

cloud.aws.region.static=sa-east-1
server.port=8080

# Region-based shipping (frete) rates in BRL, keyed by CEP macro-region
shipping.rate.sudeste=15.00
shipping.rate.sul=20.00
shipping.rate.centro-oeste=25.00
shipping.rate.norte-nordeste=30.00

cors.allowed-origins=http://localhost:3000,https://ecommerce-marcus.duckdns.org

# Multipart uploads. The product create/update forms send many parts in one
# request: scalar fields + one part per category/collection id + up to 6 images.
# Tomcat's default max-part-count is 10, which trips FileCountLimitExceededException;
# default max-file-size (1MB) / max-request-size (10MB) are below the 5MB/image the
# admin UI allows (MAX_IMAGES=6, MAX_FILE_SIZE_MB=5 in front-end).
server.tomcat.max-part-count=50
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=40MB
