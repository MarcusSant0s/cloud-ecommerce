spring.application.name=API
spring.profiles.active=local

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

cloud.aws.region.static=sa-east-1
server.port=8080

# Region-based shipping (frete) rates in BRL, keyed by CEP macro-region
shipping.rate.sudeste=15.00
shipping.rate.sul=20.00
shipping.rate.centro-oeste=25.00
shipping.rate.norte-nordeste=30.00

cors.allowed-origins=http://localhost:3000,https://ecommerce-marcus.duckdns.org

# Multipart uploads. The product create/update forms send many parts in one
# request: scal"ar fields + one part per category/collection id" + up to 6 images.
# Tomcat's default max-part-count is 10, which trips FileCountLimitExceededException.
# High-quality phone photos (iPhone HEIC/JPEG, ProRAW) can exceed 40MB, so we accept
# large originals here. The front-end downscales/re-encodes in the browser first
# (see lib/compress-image.js), so uploads are usually far smaller; these limits are
# the safety net for when compression is skipped or falls back to the original.
# Keep in sync with MAX_IMAGES=6 / MAX_FILE_SIZE_MB=100 in the front-end and with
# nginx's client_max_body_size.
server.tomcat.max-part-count=50
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB
