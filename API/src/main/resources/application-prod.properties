SPRING_DATASOURCE_URL=jdbc:postgresql://${RDS_ENDPOINT}:5432/commerce
sslmode=require
SPRING_DATASOURCE_USERNAME=${DB_USER}
SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
sslmode=require
# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks
# that the migrated schema still matches the entities and fails fast if it drifted.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# An existing database created by the old ddl-auto=update is stamped as V1 instead
# of having V1 replayed against it; a fresh database gets V1 applied normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Demo seeding is OFF unless APP_SEED_DEMO_DATA=true is set in the environment
app.seed-demo-data=${APP_SEED_DEMO_DATA:true}

# Demo checkout (skip Mercado Pago, simulate approved payment). OFF unless PAYMENTS_DEMO_MODE=true
app.payments.demo-mode=false

mercadopago.access.token=${MERCADOPAGO_ACCESS_TOKEN}
# Webhook "assinatura secreta" from the MP dashboard. Blank => signature check skipped (log warning).
mercadopago.webhook.secret=${MERCADOPAGO_WEBHOOK_SECRET}
mercadopago.notification.url=${APP_BASE_URL}/api/order/webhook
app.frontend.url=${APP_BASE_URL}
jwt.secret.key=${JWT_SECRET}

email.admin=${EMAIL_ADMIN}
password.admin=${PASSWORD_ADMIN}

# Actuator: expose only the health endpoint, and only the liveness/readiness detail
# the container healthcheck needs. No env/beans/metrics dumps on a public port.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# API docs are a development aid; don't publish the API's shape in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Avaliações do Google na home. Sem chave e place-id a seção simplesmente não
# aparece — nada é inventado para preencher o espaço.
google.places.api-key=${GOOGLE_PLACES_KEY}
google.places.place-id=${GOOGLE_PLACES_PLACE_ID:}
google.places.language=pt-BR
google.places.cache-ttl-hours=6
