spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${POSTGRES_DB}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks
# that the migrated schema still matches the entities and fails fast if it drifted.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# An existing database created by the old ddl-auto=update is stamped as V1 instead
# of having V1 replayed against it; a fresh database gets V1 applied normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Demo seeding is OFF unless APP_SEED_DEMO_DATA=true is set in the environment
app.seed-demo-data=${APP_SEED_DEMO_DATA:false}

# Demo checkout (skip Mercado Pago, simulate approved payment). OFF unless PAYMENTS_DEMO_MODE=true
app.payments.demo-mode=${PAYMENTS_DEMO_MODE:false}

mercadopago.access.token=${MP_ACCESS_TOKEN}
# Webhook "assinatura secreta" from the MP dashboard. Blank => signature check skipped (log warning).
mercadopago.webhook.secret=${MP_WEBHOOK_SECRET:}
mercadopago.notification.url=${APP_BASE_URL}/api/order/webhook
app.frontend.url=${APP_BASE_URL}
jwt.secret.key=${JWT_SECRET_KEY}

email.admin=${EMAIL_ADMIN}
password.admin=${PASSWORD_ADMIN}

# Actuator: expose only the health endpoint, and only the liveness/readiness detail
# the container healthcheck needs. No env/beans/metrics dumps on a public port.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# API docs are a development aid; don't publish the API's shape in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
