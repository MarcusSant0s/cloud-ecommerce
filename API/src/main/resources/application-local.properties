# Local development profile. Every value here is a throwaway placeholder — this
# file is committed so a fresh clone can start the app (the default profile is
# `local`). Real secrets live in the root .env, which is gitignored.
#
# Postgres for this profile: docker compose -f docker-compose.local.yml up -d

spring.datasource.url=jdbc:postgresql://localhost:5432/commerce
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.show-sql=true

# Same schema story as production: Flyway applies db/migration, Hibernate only
# validates. Keeping local on ddl-auto=update would let an entity change work
# locally and then fail validation on deploy — this way a missing migration
# breaks the app on the developer's machine instead.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Seed the demo dataset (products, users, orders) on startup
app.seed-demo-data=true

# Skip Mercado Pago and simulate an approved payment (no real payment provider locally)
app.payments.demo-mode=true

mercadopago.access.token=TEST-local-token
# Blank secret => webhook signature check is skipped locally (see MercadoPagoWebhookValidator)
mercadopago.webhook.secret=
mercadopago.notification.url=http://localhost:8080/order/webhook
app.frontend.url=http://localhost:3000
jwt.secret.key=local-dev-secret-key-change-in-prod

email.admin=admin@local.com
password.admin=admin123

# Health endpoint, same as prod, so the container healthcheck can be exercised locally.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Interactive API docs at http://localhost:8080/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
