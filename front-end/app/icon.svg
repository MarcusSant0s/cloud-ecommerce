<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="BN">
  <title>BN</title>
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="14" y1="14" x2="86" y2="86">
      <stop offset="0" stop-color="#f0d489"/>
      <stop offset="0.5" stop-color="#d2a845"/>
      <stop offset="1" stop-color="#e6c46b"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="100" height="100" rx="20" fill="#262321"/>

  <!-- Outer ring and dotted inner ring -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#gold)" stroke-width="1.4"/>
  <circle cx="50" cy="50" r="37" fill="none" stroke="url(#gold)" stroke-width="1.1"
          stroke-linecap="round" stroke-dasharray="0 2.406" opacity="0.9"/>

  <!-- B: thin stem with small serifs, two bowls (the lower one larger) -->
  <path d="M27.5 30 H38.5 A7 8.5 0 0 1 38.5 47 H31 M31 47 H39.5 A8.5 11.5 0 0 1 39.5 70 H27.5 M31 30 V70"
        fill="none" stroke="url(#gold)" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- N: thin stems with serifs, heavier diagonal (high-contrast stroke) -->
  <g fill="url(#gold)">
    <rect x="50.35" y="30" width="1.4" height="40"/>
    <rect x="68.35" y="30" width="1.4" height="40"/>
    <rect x="48" y="29.3" width="6.2" height="1.4"/>
    <rect x="48" y="69.3" width="6.2" height="1.4"/>
    <rect x="65.9" y="69.3" width="6.2" height="1.4"/>
    <rect x="65.9" y="29.3" width="6.2" height="1.4"/>
    <polygon points="51,30 54.4,30 69,70 65.6,70"/>
  </g>
</svg>
