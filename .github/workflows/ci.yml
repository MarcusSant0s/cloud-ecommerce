name: CI

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run: 
        working-directory: ./API
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: API/pom.xml

      

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefice-reports
          path: backend/target/surefire-reports

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front-end

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        run: npm ci 

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
  
  build-and-push:
    needs: [backend, frontend]
    if: github.ref == 'refs/head/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
     - name: Checkout code
     - uses: actions/checkout@v4

     - name: log in to GHCR
       uses: docker/login-action@v3
       with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

     - name: Build and push bacckend images
       uses: docker/build-push-action@v6
       with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/betaproject-backend:latest
              ghcr.io/${{ github.repository_owner }}/betaproject-backend:${{ github.sha }
     - name: Build and push frontend image
       uses: docker/build-push-action@v6
       with:
            context: ./frontend
            push: true
            tags: |
              ghcr.io/${{ github.repository_owner }}/betaproject-frontend:latest
              ghcr.io/${{ github.repository_owner }}/betaproject-frontend:${{ github.sha }}
 
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
 
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/betaProject
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d


             