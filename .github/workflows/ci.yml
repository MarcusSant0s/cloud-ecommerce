name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./API

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: API/pom.xml

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: API/target/surefire-reports

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: API/target/site/jacoco

      - name: Upload jar for the smoke test
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: API/target/*.jar
          retention-days: 1

  # Boots the packaged jar with the prod profile against a throwaway Postgres
  # (a service container, never the real RDS). This is what catches a broken
  # migration, a schema that no longer matches the entities (ddl-auto=validate),
  # or a bean that only fails to wire at runtime: none of which the unit tests
  # can see.
  #
  # It is NOT in the `needs` of build-and-push yet, so a red smoke test cannot
  # block a deploy. Once it has been green for a while, add `backend-smoke` to
  # the `needs` list of build-and-push to make it a real gate.
  backend-smoke:
    needs: backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar

      - name: Boot with the prod profile and wait for health
        env:
          # Environment variables outrank the packaged application-prod
          # properties, so these point the app at the CI Postgres (no SSL)
          # instead of the RDS endpoint.
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/commerce
          SPRING_DATASOURCE_USERNAME: commerce
          SPRING_DATASOURCE_PASSWORD: ci-only
          # Same names the prod profile reads, with throwaway CI values.
          DB_USER: commerce
          SENHA_RDS: ci-only
          RDS_ENDPOINT: localhost
          MERCADOPAGO_ACCESS_TOKEN: TEST-ci-token
          MERCADOPAGO_WEBHOOK_SECRET: ci-webhook-secret
          APP_BASE_URL: https://ci.example
          JWT_SECRET: a-ci-only-signing-key-long-enough-for-hs256-abcdef
          EMAIL_ADMIN: admin@ci.example
          PASSWORD_ADMIN: ci-password
        run: |
          java -jar ./*.jar --spring.profiles.active=prod --server.port=8080 > app.log 2>&1 &
          echo $! > app.pid

          healthy=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Application is UP"
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" != "1" ]; then
            echo "::error::Application never became healthy"
            tail -100 app.log
            exit 1
          fi

      - name: Smoke-test the auth and authorization rules
        run: |
          set -e
          # A protected route without a token must be 401, not 403 or 500.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/users/me)
          [ "$code" = "401" ] || { echo "::error::expected 401 on /users/me, got $code"; exit 1; }

          # A public route stays public.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/product)
          [ "$code" = "200" ] || { echo "::error::expected 200 on /product, got $code"; exit 1; }

          # Bean validation must reject a malformed registration with 400.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"firstName":"","lastName":"X","email":"nope","password":""}')
          [ "$code" = "400" ] || { echo "::error::expected 400 on invalid register, got $code"; exit 1; }

          echo "Auth smoke tests passed"

      - name: Stop the application
        if: always()
        run: kill "$(cat app.pid)" 2>/dev/null || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front-end

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  build-and-push:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./API
          push: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/cloudecommerce-backend:latest
            ghcr.io/${{ env.OWNER_LC }}/cloudecommerce-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./front-end
          push: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/cloudecommerce-frontend:latest
            ghcr.io/${{ env.OWNER_LC }}/cloudecommerce-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # id-token: write lets this job request the OIDC token that AWS exchanges
    # for temporary credentials. No AWS key and no SSH key are stored in GitHub.
    permissions:
      id-token: write
      contents: read
    env:
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

    steps:
      - name: Assume the AWS deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Write the deploy script
        run: |
          cat > deploy.sh <<'EOF'
          #!/bin/bash
          # Runs on the EC2 as root (SSM Run Command). Git and Docker Compose run
          # as ec2-user so file ownership and any registry login stay as before.
          set -euo pipefail
          as_user() { sudo -u ec2-user -H "$@"; }

          cd /home/ec2-user/cloud-ecommerce
          as_user git pull origin main

          # /run is tmpfs: /run/commerce.env disappears on every reboot, so it
          # is regenerated from SSM on each deploy.
          /opt/app/load-secrets.sh

          # Free disk BEFORE pulling. Disk usage peaks during the pull, while
          # the old images are still on disk. Running containers keep their
          # images; only stopped containers and unused images go.
          docker container prune -f
          docker image prune -af

          as_user docker compose -f docker-compose.yml pull
          as_user docker compose -f docker-compose.yml up -d

          # Don't report a green deploy until the API actually answers. Compose
          # returns as soon as the containers are created, which is well before
          # Flyway and the JPA bootstrap have finished.
          echo "Waiting for the API to report healthy..."
          status=starting
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' commerce-api 2>/dev/null || echo starting)
            echo "  attempt $i: $status"
            [ "$status" = "healthy" ] && break
            sleep 10
          done

          if [ "$status" != "healthy" ]; then
            echo "Deploy failed: commerce-api is '$status' after 5 minutes"
            as_user docker compose -f docker-compose.yml logs --tail=120 backend
            exit 1
          fi

          echo "Deploy healthy."
          # Drop whatever the new deploy left unused.
          docker image prune -f
          EOF

      - name: Run it on the EC2 through SSM
        run: |
          # jq -Rs turns the whole file into one JSON string, so the script
          # needs no quoting or escaping inside the command line.
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA}" \
            --parameters "$(jq -Rs '{commands: [.], executionTimeout: ["900"]}' deploy.sh)" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          # `aws ssm wait` gives up after ~100 s and a deploy takes longer, so
          # poll by hand. The invocation does not exist for a moment after
          # send-command, hence the fallback to Pending.
          STATUS=Pending
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{out: StandardOutputContent, err: StandardErrorContent}' --output json \
            | jq -r '.out, .err'

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy finished with SSM status: $STATUS"
            exit 1
          fi