services:
  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build: ./API
    container_name: commerce-api
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_HOST: ${DB_HOST}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      EMAIL_ADMIN: ${EMAIL_ADMIN}
      PASSWORD_ADMIN: ${PASSWORD_ADMIN}
      # Demo/resume seeding: set both to "true"/"update" on a fresh DB to populate mocks
      APP_SEED_DEMO_DATA: ${APP_SEED_DEMO_DATA:-false}
      DDL_AUTO: ${DDL_AUTO:-validate}
      # Demo checkout: skip Mercado Pago and simulate an approved payment
      PAYMENTS_DEMO_MODE: ${PAYMENTS_DEMO_MODE:-false}
    depends_on:
      - postgres
    networks:
      - app-network

  frontend:
    build:
      context: ./front-end
      args:
        NEXT_PUBLIC_API_URL: ${APP_BASE_URL}/api
    container_name: commerce-web
    restart: always
    environment:
      # Server-side (SSR) calls reach the backend directly on the internal
      # network — the container can't reach its own public domain.
      - INTERNAL_API_URL=http://commerce-api:8080
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: commerce-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network: