services:
  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  backend:
    image: ghcr.io/marcussant0s/cloudecommerce-backend:latest
    container_name: commerce-api
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      DB_USER: ${DB_USER}
      # Defaults to the compose service name so a missing DB_HOST cannot silently
      # point the API at nothing.
      DB_HOST: ${DB_HOST:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL}
      # The AWS SDK's default credential chain reads exactly these two names.
      # This used to pass AWS_SECRET_KEY, which the chain ignores, so S3 fell back
      # to unauthenticated calls.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      EMAIL_ADMIN: ${EMAIL_ADMIN}
      PASSWORD_ADMIN: ${PASSWORD_ADMIN}
      # Demo/resume seeding: set to "true" on a fresh DB to populate mocks.
      APP_SEED_DEMO_DATA: ${APP_SEED_DEMO_DATA:-false}
      # Demo checkout: skip Mercado Pago and simulate an approved payment
      PAYMENTS_DEMO_MODE: ${PAYMENTS_DEMO_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Flyway plus JPA bootstrap takes a while on a cold start; don't let the
      # container get marked unhealthy before it has had a chance to come up.
      start_period: 90s
    networks:
      - app-network
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  frontend:
    image: ghcr.io/marcussant0s/cloudecommerce-frontend:latest
    container_name: commerce-web
    restart: always
    environment:
      # Server-side (SSR) calls reach the backend directly on the internal
      # network — the container can't reach its own public domain.
      - INTERNAL_API_URL=http://commerce-api:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  nginx:
    image: nginx:alpine
    container_name: commerce-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot for Let's Encrypt HTTP-01 renewal.
      - certbot-webroot:/var/www/certbot
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - app-network
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  certbot-webroot:

networks:
  app-network:
